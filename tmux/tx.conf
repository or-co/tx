# >>> tx >>>  (managed by tx's install.sh — remove with uninstall.sh)
run-shell -b 'TX_SOCK="#{socket_path}" @TX@ _loop >/dev/null 2>&1'
set-hook -g after-new-window    'run-shell -b "TX_SOCK=#{socket_path} @TX@ save --debounce >/dev/null 2>&1"'
set-hook -g after-split-window  'run-shell -b "TX_SOCK=#{socket_path} @TX@ save --debounce >/dev/null 2>&1"'
set-hook -g after-rename-window 'run-shell -b "TX_SOCK=#{socket_path} @TX@ save --debounce >/dev/null 2>&1"'
set-hook -g client-detached     'run-shell -b "TX_SOCK=#{socket_path} @TX@ save --full >/dev/null 2>&1"'
set-hook -g session-created     'run-shell -b "TX_SOCK=#{socket_path} @TX@ _nudge >/dev/null 2>&1"'
bind S run-shell -b 'TX_SOCK="#{socket_path}" @TX@ save --full --now >/dev/null 2>&1 && tmux display "tx: saved"'
bind Q display-popup -E -w 80% -h 50% '@TX@ down'
if -F '#{m:*@tx_stale*,#{status-right}}' '' "set -ag status-right '#{?@tx_stale, #[fg=red]tx!#[default],}#{?@tx_paused, #[fg=yellow]tx:paused#[default],}'"
# <<< tx <<<
